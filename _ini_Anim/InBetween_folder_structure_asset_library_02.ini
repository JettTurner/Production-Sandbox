01_Assets/
├── 00_Build_Kit/                 # Core reusable building blocks
│   ├── 01_Shapes/                # Primitives, blocks, modular bases
│   ├── 02_Mechanical/            # Screws, gears, hinges, generic tech
│   ├── 03_Facial_Tools/          # Eyes, mouths, brows, mouth charts
│   └── 04_Textures_Base/         # Generic tiling or procedural textures
│
├── 01_Props_General/             # Everyday objects, scalable for any scene
│   ├── Furniture/
│   ├── Tools/
│   ├── Toys/
│   ├── Vehicles/                 # Bikes, cars, carts
│   └── Misc/
│
├── 02_Sets_Modular/              # Environment building blocks
│   ├── Urban/                    # Bricks, lampposts, windows, signage
│   ├── Forest/                   # Trees, logs, stumps, rocks
│   ├── Interior/                 # Rooms, furniture shells, doors
│   └── Platforms/                # Stages, ramps, floating blocks
│
├── 03_Characters_Parts/          # Everything modular for character assembly
│   ├── Heads/
│   ├── Limbs/
│   ├── Accessories/              # Hats, bags, glasses
│   └── Expressions/              # Mouth packs, eye packs, brows
│
├── 04_SpecialFX/                 # Visual accents to punch up animation
│   ├── Smear_Frames/
