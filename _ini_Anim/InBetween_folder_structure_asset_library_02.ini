│   └── Overlays/                 # Glows, speed lines, atmosphere
│
├── 05_Materials_Textures/        # Organized by art style
│   ├── Wood/
│   ├── Paint/
│   ├── Fabric/
│   ├── Metal/
│   └── ReferenceBoards/          # Color keys, texture sheets
│
└── 06_Utilities/                 # Production helpers
    ├── Templates/                # Scene & shot templates
    ├── Dummy_Rigs/               # For testing animation & scale
    ├── Scale_Guides/             # Model sheets, height charts
    └── Pipeline_Tools/           # Scripts, rig tools, constraints
